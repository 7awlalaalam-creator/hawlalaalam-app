name: فحص بناء أندرويد (فرع التطوير)

# يبني نسخة تجريبية فقط على فرع v2، دون توقيع ولا نشر إصدار
on:
  push:
    branches: [v2]
    paths:
      - '*.zip'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك ضغط المشروع
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: البناء
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug lintDebug 2>&1 | tee build.log || true
          grep -E "error:|warning: \[|e: " build.log | head -30 | while IFS= read -r l; do echo "::warning title=gradle::$l"; done
          grep -q "BUILD SUCCESSFUL" build.log || { tail -40 build.log | while IFS= read -r l; do echo "::error title=gradle::$l"; done; exit 1; }
      - name: نتائج الفحص (Lint)
        if: always()
        run: |
          f=$(ls app/build/reports/lint-results-debug.txt 2>/dev/null || true)
          [ -n "$f" ] && grep -E "Error|Warning" "$f" | grep -v "^0 errors" | head -20 | while IFS= read -r l; do echo "::notice title=lint::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
