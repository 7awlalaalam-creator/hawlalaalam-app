name: لقطات شاشات أندرويد
# بناء نسخة للمعاينة وتشغيلها على محاكي أندرويد وتصوير الشاشات الجديدة (للمراجعة فقط، لا يُنشر شيء للمستخدمين)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: فك ضغط المشروع
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: بناء نسخة المعاينة
        run: gradle --no-daemon assembleDebug
      - name: تفعيل KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: المحاكي والتصوير
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash shots.sh
      - name: نشر اللقطات في فرع ci-shots-android
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config --global user.name "ci"; git config --global user.email "ci@users.noreply.github.com"
          rm -rf /tmp/cs && mkdir -p /tmp/cs && cp shots/*.png /tmp/cs/ 2>/dev/null || exit 0
          cd /tmp/cs && git init -q && git checkout -q -b ci-shots-android && git add . && git commit -qm "android shots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots-android
