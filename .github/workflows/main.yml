name: بناء تطبيق أندرويد
on:
  push:
    branches: [main]
    # نسخة أندرويد تُبنى فقط عند تحديث ملف المشروع المضغوط (تعديلات iOS وغيرها لا تُصدر نسخة)
    paths:
      - '*.zip'
  # النشر للمستخدمين (إصدار يراه زر «البحث عن تحديث») لا يكون إلا بطلب صريح: Run workflow ← نشر = نعم
  workflow_dispatch:
    inputs:
      publish:
        description: 'نشر الإصدار للمستخدمين'
        type: boolean
        default: false
      beta:
        description: 'نسخة تجريبية لك فقط (رابط تحميل لا يظهر للمستخدمين في البحث عن تحديث)'
        type: boolean
        default: false
      trial:
        description: 'نسخة تجربة تُثبَّت بجانب نسخة المتجر (اسم وحزمة مختلفان)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك ضغط المشروع
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/. .
      - name: نسخة التجربة (تُثبَّت بجانب نسخة المتجر)
        if: inputs.trial == true
        run: |
          sed -i 's|applicationId = "com.hawlalaalam.quran"|applicationId = "com.hawlalaalam.quran"\n        applicationIdSuffix = ".trial"|' app/build.gradle.kts
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">القرآن · تجربة</string>|' app/src/main/res/values*/strings.xml
          grep -n "applicationIdSuffix" app/build.gradle.kts
          grep -n "app_name" app/src/main/res/values*/strings.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: البناء
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug
          fi
      - name: تجميع الملفات
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/*/*.apk; do [ -e "$f" ] && cp "$f" out/hawlalaalam-quran.apk; done
          for f in app/build/outputs/bundle/*/*.aab; do [ -e "$f" ] && cp "$f" out/hawlalaalam-quran.aab; done
          # تطبيق الساعة (Wear OS): يُرفع في Google Play على مسار Wear OS في نفس صفحة التطبيق
          for f in wear/build/outputs/bundle/*/*.aab; do [ -e "$f" ] && cp "$f" out/hawlalaalam-wear.aab; done
      - uses: actions/upload-artifact@v4
        with:
          name: hawlalaalam-app
          path: out/
      - name: نشر إصدار للتحميل
        if: env.KEYSTORE_FILE != '' && inputs.publish == true && inputs.trial != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: القرآن حول العالم 2.0.${{ github.run_number }}
          body: |
            ## الجديد في هذا الإصدار
            - المساجد القريبة: خريطة بالمساجد حولك مرتبة من الأقرب، مع المسافة ووقت المشي والسيارة وزر الاتجاهات. من «الأدوات» أو زر «أقرب مسجد» في إشعار الأذان.
            - اسأل عن الآية ✦: إجابة مختصرة من التفاسير الستة مع اسم مصدر كل قول (تحتاج إنترنت).
            - معنى الكلمة بلمسة: الكلمات الغريبة عليها نقاط ذهبية في وضع القراءة، اضغطها فيظهر معناها من غريب القرآن لمجمع الملك فهد.
            - البحث الذكي: يفهم صيغ الكلمة ويصحّح الأخطاء ويبحث بالمعنى، ويعرف «آية الكرسي» و2:255.
            - الصفحة كاملة على الشاشة: من زر «Aa» في المصحف.
            - تفسير الجلالين في مكتبة التفاسير، و«آيات بمعناها» في لوحة كل آية.
            - دعوة أهلك بعد إتمام الختمة.
            - تطبيق الساعة يأخذ إعداداتك من الجوال تلقائيًا، ولا يتكرر اهتزاز الأذان.
            - الموقع التقريبي فقط، واستهلاك أقل للبطارية.
          files: out/*

      # نسخة تجريبية: «إصدار تجريبي» على GitHub؛ زر «البحث عن تحديث» يقرأ آخر إصدار رسمي فقط فلا يراها أحد
      - name: نسخة تجريبية للتحميل
        if: env.KEYSTORE_FILE != '' && (inputs.beta == true || inputs.trial == true) && inputs.publish != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.trial && 'trial' || 'beta' }}-2.0.${{ github.run_number }}
          name: ${{ inputs.trial && 'تجربة (بجانب نسخة المتجر)' || 'تجريبي' }} — القرآن حول العالم 2.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: نسخة تجريبية للاختبار فقط، ليست للنشر.
          files: out/*
