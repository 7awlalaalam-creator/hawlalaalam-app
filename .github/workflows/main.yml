name: بناء تطبيق أندرويد
on:
  push:
    branches: [main]
    # نسخة أندرويد تُبنى فقط عند تحديث ملف المشروع المضغوط (تعديلات iOS وغيرها لا تُصدر نسخة)
    paths:
      - '*.zip'
  # النشر للمستخدمين (إصدار يراه زر «البحث عن تحديث») لا يكون إلا بطلب صريح: Run workflow ← نشر = نعم
  workflow_dispatch:
    inputs:
      publish:
        description: 'نشر الإصدار للمستخدمين'
        type: boolean
        default: false
      beta:
        description: 'نسخة تجريبية لك فقط (رابط تحميل لا يظهر للمستخدمين في البحث عن تحديث)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك ضغط المشروع
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: البناء
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug
          fi
      - name: تجميع الملفات
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/*/*.apk; do [ -e "$f" ] && cp "$f" out/hawlalaalam-quran.apk; done
          for f in app/build/outputs/bundle/*/*.aab; do [ -e "$f" ] && cp "$f" out/hawlalaalam-quran.aab; done
      - uses: actions/upload-artifact@v4
        with:
          name: hawlalaalam-app
          path: out/
      - name: نشر إصدار للتحميل
        if: env.KEYSTORE_FILE != '' && inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: القرآن حول العالم 2.0.${{ github.run_number }}
          body: |
            ## الجديد في الإصدار 2.0
            - شاشة «اليوم»: مواقيت اليوم كلها، وسلسلة أيامك مع القرآن، ومشاركة آية اليوم صورةً.
            - الصلاة القادمة على شاشة القفل بعدّاد تنازلي (تُفعّل من الإعدادات).
            - المصحف مع التفسير: كل آية وتحتها تفسيرها الميسر دون إنترنت.
            - الحفظ: أضف الآيات لحفظك، وراجعها بمراجعة متباعدة.
            - التسميع (تجريبي): اقرأ من حفظك ويتابعك التطبيق كلمة بكلمة.
            - البحث بالمعنى: ابحث عن موضوع، مثل «بر الوالدين»، فتظهر الآيات التي تتحدث عنه.
            - تكرار الآية في المشغّل.
            - «رحلتي»: سلسلتك وأيام قراءتك وختماتك وحفظك.
            - ختمة العائلة: اختموا القرآن معًا، وكل فرد يحجز جزءًا.
            - الاستماع أصليًا: كل قرّاء mp3quran والإذاعات، مع سرعة التلاوة ومؤقت النوم والتحميل دون إنترنت.
            - الأذكار أصلية دون إنترنت: الصباح والمساء والنوم وبعد الصلاة، بعدّاد لكل ذكر.
            - مواقيت الصلاة وتفسير الآية وختمة العائلة شاشات أصلية داخل التطبيق.
            - تظليل الآيات بالألوان، و«ملاحظاتي» ومجموعات الآيات.
            - الحفظ المتقدم: الكلمة التالية، وسجل الأخطاء، ومراجعة الآيات الضعيفة.
            - النسخ الاحتياطي: تلقائيًا في Google Drive، وتصدير واستعادة ملف.
          files: out/*

      # نسخة تجريبية: «إصدار تجريبي» على GitHub؛ زر «البحث عن تحديث» يقرأ آخر إصدار رسمي فقط فلا يراها أحد
      - name: نسخة تجريبية للتحميل
        if: env.KEYSTORE_FILE != '' && inputs.beta == true && inputs.publish != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-2.0.${{ github.run_number }}
          name: تجريبي — القرآن حول العالم 2.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: نسخة تجريبية للاختبار فقط، ليست للنشر.
          files: out/*
