name: فحص مؤقت (بدون نشر)
on:
  push:
    branches: [sdk-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o -q HawlalaalamApp.zip -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/. .
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: dependencies
        run: gradle --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt || true; grep -E "fragment|firebase-messaging|play-services|activity:|core:" deps.txt | sed 's/^[ |+\\-]*//' | sort -u | head -60
      - name: build
        run: gradle --no-daemon assembleRelease
