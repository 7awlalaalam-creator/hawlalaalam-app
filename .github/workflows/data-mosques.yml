name: بيانات المساجد (OpenStreetMap)
# ملفات صغيرة بالمساجد لكل مربع ٠٫٢٥° في دول الخليج ومصر والأردن من OpenStreetMap (ODbL)،
# يقرؤها التطبيق مباشرة بدل خوادم Overpass البطيئة، ويُعاد توليدها شهريًا
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: تحميل وتصفية
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null
          mkdir -p /tmp/o && cd /tmp/o
          for r in asia/gcc-states africa/egypt asia/jordan; do
            n=$(basename $r)
            curl -sSL -o $n.pbf https://download.geofabrik.de/$r-latest.osm.pbf
            osmium tags-filter -O -o $n-f.pbf $n.pbf nwr/amenity=place_of_worship nwr/building=mosque
            osmium export -O -f geojsonseq --geometry-types=point,polygon -o $n.geojsonseq $n-f.pbf
            ls -la $n.pbf $n.geojsonseq
          done
          # Overture Maps (أماكن مفتوحة CDLA-Permissive-2.0): تغطية أوسع للمساجد من OpenStreetMap وحده
          pip install -q duckdb
          REL=$(aws s3 ls --no-sign-request s3://overturemaps-us-west-2/release/ | awk '{print $2}' | sed 's#/##' | sort | tail -1)
          echo "::notice::overture $REL"
          python3 - "$REL" <<'PY' || echo "::warning::overture failed"
          import duckdb, json, sys
          rel = sys.argv[1]
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs; SET s3_region='us-west-2';")
          q = f'''
            SELECT names.primary AS name, (bbox.ymin + bbox.ymax) / 2 AS lat, (bbox.xmin + bbox.xmax) / 2 AS lon, categories.primary AS cat
            FROM read_parquet('s3://overturemaps-us-west-2/release/{rel}/theme=places/type=place/*', filename=true, hive_partitioning=1)
            WHERE bbox.xmin BETWEEN 24 AND 61 AND bbox.ymin BETWEEN 12 AND 33
              AND (categories.primary = 'mosque' OR list_contains(categories.alternate, 'mosque'))
          '''
          src = f"read_parquet('s3://overturemaps-us-west-2/release/{rel}/theme=places/type=place/*', filename=true, hive_partitioning=1)"
          try:
              cols = con.execute(f"DESCRIBE SELECT * FROM {src} LIMIT 1").fetchall()
              print('::notice::cols ' + ' | '.join(f'{c[0]}:{str(c[1])[:120]}' for c in cols)[:3000])
          except Exception as e:
              print('::notice::describe err ' + str(e)[:800])
          try:
              rows = con.execute(q).fetchall()
          except Exception as e:
              print('::notice::query err ' + str(e)[:800]); raise
          json.dump(rows, open('/tmp/o/overture.json', 'w'), ensure_ascii=False)
          print('::notice::overture mosques', len(rows))
          PY
          python3 - <<'PY'
          import json, glob, os, re, math, collections
          out = collections.defaultdict(list); seen = set(); n = 0
          for f in glob.glob('/tmp/o/*.geojsonseq'):
              for line in open(f, encoding='utf-8'):
                  line = line.strip().lstrip('\x1e')
                  if not line: continue
                  g = json.loads(line); p = g.get('properties') or {}; geo = g.get('geometry') or {}
                  name = p.get('name:ar') or p.get('name') or ''
                  rel = p.get('religion')
                  ok = rel == 'muslim' or p.get('building') == 'mosque' or re.search(r'مسجد|جامع|مصلى|masjid|mosque', name, re.I)
                  if not ok or rel in ('christian', 'jewish', 'hindu', 'buddhist', 'sikh'): continue
                  if geo.get('type') == 'Point': lo, la = geo['coordinates'][:2]
                  else:
                      ring = geo['coordinates'][0] if geo.get('type') == 'Polygon' else geo['coordinates'][0][0]
                      lo = sum(c[0] for c in ring) / len(ring); la = sum(c[1] for c in ring) / len(ring)
                  key = (round(la, 4), round(lo, 4))
                  if key in seen: continue
                  seen.add(key)
                  en = p.get('name:en') or ''
                  k = re.search(r'جامع|jami', name + ' ' + en, re.I) or p.get('mosque') == 'jami' or p.get('friday_prayer') == 'yes'
                  m = re.search(r'مصلى|مصلّى|musalla|prayer room', name + ' ' + en, re.I)
                  out[(math.floor(la * 4), math.floor(lo * 4))].append([round(la, 5), round(lo, 5), name, en if en != name else '', 1 if k else (2 if m else 0)])
                  n += 1
          # دمج Overture: نضيف ما لا يبعد ٤٠ م عن مسجد موجود
          grid = collections.defaultdict(list)
          for (a, b), L in out.items():
              for e in L: grid[(round(e[0], 3), round(e[1], 3))].append(e)
          def near(la, lo):
              for da in (-0.001, 0, 0.001):
                  for db in (-0.001, 0, 0.001):
                      for e in grid.get((round(la + da, 3), round(lo + db, 3)), []):
                          if abs(e[0] - la) < 0.0004 and abs(e[1] - lo) < 0.0004: return True
              return False
          added = 0
          if os.path.exists('/tmp/o/overture.json'):
              for name, la, lo, cat in json.load(open('/tmp/o/overture.json')):
                  if la is None or lo is None or near(la, lo): continue
                  name = name or ''
                  isar = re.search(r'[\u0600-\u06FF]', name)
                  k = re.search(r'جامع|jami', name, re.I); m = re.search(r'مصلى|مصلّى|musalla|prayer room', name, re.I)
                  e = [round(la, 5), round(lo, 5), name if isar else '', '' if isar else name, 1 if k else (2 if m else 0)]
                  out[(math.floor(la * 4), math.floor(lo * 4))].append(e); grid[(round(la, 3), round(lo, 3))].append(e)
                  added += 1; n += 1
          print('::notice::overture added', added)
          d = os.path.join(os.environ['GITHUB_WORKSPACE'], 'data/mosques')
          if os.path.isdir(d):
              for x in glob.glob(d + '/*.json'): os.remove(x)
          os.makedirs(d, exist_ok=True)
          for (a, b), L in out.items():
              json.dump(L, open(f'{d}/{a}_{b}.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          json.dump({'tiles': sorted(f'{a}_{b}' for a, b in out), 'count': n}, open(f'{d}/index.json', 'w'), separators=(',', ':'))
          print('::notice::mosques', n, 'tiles', len(out))
          PY
          du -sh $GITHUB_WORKSPACE/data/mosques
      - name: حفظ
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add data/mosques 2>&1 | sed 's/^/::notice::add /'
          git commit -qm "data: mosques (OSM)" 2>&1 | sed 's/^/::notice::commit /' || true
          for i in 1 2 3; do
            if git push 2>&1 | sed 's/^/::notice::push /'; [ ${PIPESTATUS[0]} -eq 0 ]; then echo "::notice::pushed"; exit 0; fi
            git pull --rebase 2>&1 | sed 's/^/::notice::pull /'
          done
          exit 1
