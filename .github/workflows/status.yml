name: حالة المراجعة في أبل
# يقرأ فقط (لا يغيّر شيئًا): حالة نسخة المتجر ونسخ TestFlight عبر App Store Connect API
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: الحالة
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + tok}
          B = "https://api.appstoreconnect.apple.com/v1"
          app = "6823910862"
          v = requests.get(f"{B}/apps/{app}/appStoreVersions?limit=5", headers=H).json()
          for x in v.get("data", []):
              a = x["attributes"]
              print(f"::notice title=store::{a.get('platform')} {a.get('versionString')} = {a.get('appStoreState')} / {a.get('appVersionState')}")
          b = requests.get(f"{B}/builds?filter[app]={app}&sort=-uploadedDate&limit=3&include=buildBetaDetail", headers=H).json()
          det = {i["id"]: i["attributes"] for i in b.get("included", []) if i["type"] == "buildBetaDetails"}
          for x in b.get("data", []):
              d = det.get(x["relationships"]["buildBetaDetail"]["data"]["id"], {})
              print(f"::notice title=testflight::build {x['attributes']['version']} external={d.get('externalBuildState')} internal={d.get('internalBuildState')}")
          c = requests.get(f"{B}/certificates?limit=50", headers=H).json()
          for x in c.get("data", []):
              a = x["attributes"]
              print(f"::notice title=cert::{a.get('certificateType')} | {a.get('displayName')} | {a.get('name')} | exp {a.get('expirationDate','')[:10]} | {x['id']}")
          # بلاغات التعطّل من TestFlight (تُحفظ في فرع ci-crash للمراجعة)
          os.makedirs("crash", exist_ok=True)
          cs = requests.get(f"{B}/apps/{app}/betaFeedbackCrashSubmissions?limit=10&sort=-createdDate", headers=H).json()
          if "errors" in cs: print("::warning::crash " + str(cs["errors"])[:300])
          for x in cs.get("data", []):
              a = x["attributes"]
              print(f"::notice title=crash::{a.get('createdDate')} {a.get('deviceModel')} iOS {a.get('osVersion')} build {a.get('buildBundleId','')} comment={a.get('comment')}")
              open(f"crash/{x['id']}.json", "w").write(__import__('json').dumps(a, ensure_ascii=False, indent=1))
              lg = requests.get(f"{B}/betaFeedbackCrashSubmissions/{x['id']}/crashLog", headers=H).json()
              t = (lg.get("data") or {}).get("attributes", {}).get("logText")
              if t: open(f"crash/{x['id']}.crash", "w").write(t)
              elif "errors" in lg: print("::warning::log " + str(lg["errors"])[:200])
          if "errors" in v: print("::error::" + str(v["errors"])[:300])
          PY
      - name: نشر بلاغات التعطّل في فرع ci-crash
        if: always()
        run: |
          [ -d crash ] && ls crash | grep -q . || exit 0
          git config --global user.name "ci"; git config --global user.email "ci@users.noreply.github.com"
          cd crash && git init -q && git checkout -q -b ci-crash && git add . && git commit -qm "crash logs"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-crash
