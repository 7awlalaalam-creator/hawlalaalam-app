name: بناء تطبيق iOS

# يعمل عند أي تعديل في مجلد ios. بيانات المصحف والخطوط تؤخذ من مشروع أندرويد داخل HawlalaalamApp.zip
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/fastlane/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'رفع النسخة إلى TestFlight'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ١) فحص البناء على محاكي آيفون: يعمل الآن دون حساب Apple Developer
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: بيانات المصحف والخطوط من مشروع أندرويد
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/app .

      - name: منصة watchOS (لتطبيق الساعة)
        run: |
          xcodebuild -showsdks | grep -i watch || true
          if ! xcodebuild -showsdks | grep -qi watchos; then xcodebuild -downloadPlatform watchOS; fi
          xcrun simctl list runtimes | grep -i watch || true

      - name: تثبيت XcodeGen
        run: brew install xcodegen

      - name: توليد مشروع Xcode
        working-directory: ios
        run: xcodegen generate

      - name: البناء للمحاكي
        working-directory: ios
        run: |
          set -o pipefail
          # دون -sdk: تطبيق الساعة المضمَّن يُبنى تلقائيًا لمحاكي الساعة
          xcodebuild -project Hawl.xcodeproj -scheme Hawl -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # الأخطاء تظهر في صفحة التشغيل (Annotations) لتسهيل إصلاحها
            grep -E "error:" build.log | sed -E 's#^.*/ios/##' | sort -u | head -30 | while IFS= read -r l; do echo "::error title=build::$l"; done
            tail -15 build.log | while IFS= read -r l; do echo "::notice title=build-tail::$l"; done
            exit 1
          fi

      - name: لقطات شاشة حقيقية على محاكي آيفون
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ios
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/Hawl.app
          MODEL=$(xcrun simctl list devicetypes | grep -oE "iPhone 1[5-7] Pro \(" | head -1 | sed 's/ ($//')
          UDID=$(xcrun simctl create shots "${MODEL:-iPhone 15 Pro}")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # بيانات تجريبية: جدة، تخطّي الترحيب والجولة
          ARGS=(-welcomed '<true/>' -tour_v '<integer>99</integer>' -lat '<real>21.5433</real>' -lng '<real>39.1728</real>' -city 'جدة' -country 'SA' -live_prayer '<true/>')
          shot() { sleep "${3:-4}"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          go() { xcrun simctl openurl "$UDID" "$1" || true; shot "$2" "$3"; }
          # كل شاشة بتشغيل جديد ووسيط -open_route (دون نافذة «فتح في…؟» التي يُظهرها openurl)
          route() { xcrun simctl terminate "$UDID" com.hawlalaalam.quran || true; sleep 1
                    xcrun simctl launch "$UDID" com.hawlalaalam.quran "${ARGS[@]}" -open_route "$1"; shot "$2" "${3:-7}"; }
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            xcrun simctl terminate "$UDID" com.hawlalaalam.quran || true
            xcrun simctl launch "$UDID" com.hawlalaalam.quran "${ARGS[@]}"
            shot "$mode-01-today" 12
            route "mushaf?page=562" "$mode-02-mushaf" 9
            route "tools" "$mode-03-tools"
            route "journey" "$mode-04-journey"
            route "hifz" "$mode-05-hifz" 10
            route "find" "$mode-06-find" 10
            route "notifications" "$mode-07-notifications"
            route "khatma" "$mode-08-khatma"
            route "listen" "$mode-09-listen" 12
            route "reciter?id=123" "$mode-10-reciter" 12
            route "azkar?s=morning" "$mode-11-azkar"
            route "tafsir?s=2&a=152" "$mode-12-tafsir"
            route "family" "$mode-13-family"
            route "backup" "$mode-14-backup"
          done
          # النشاط الحي «الصلاة القادمة»: نفتح التطبيق ثم الإعدادات فتظهر الجزيرة الديناميكية
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" com.hawlalaalam.quran || true
          xcrun simctl launch "$UDID" com.hawlalaalam.quran "${ARGS[@]}"
          sleep 8
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          shot "live-island" 5
          ls -la shots

      - name: لقطات تطبيق الساعة على محاكي Apple Watch
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ios
        run: |
          set -x
          WAPP=$(find build/dd/Build/Products -path "*watchsimulator*" -name "HawlWatch.app" -maxdepth 3 | head -1)
          echo "watch app: $WAPP"
          [ -n "$WAPP" ] || exit 0
          WT=$(xcrun simctl list devicetypes | grep -oE "Apple Watch Series [0-9]+ \(4[56]mm\)" | tail -1)
          [ -n "$WT" ] || WT=$(xcrun simctl list devicetypes | grep -oE "Apple Watch[^()]*\([0-9]+mm\)" | tail -1)
          WR=$(xcrun simctl list runtimes | grep -i watchos | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.watchOS-[0-9-]+" | tail -1)
          [ -n "$WT" ] && [ -n "$WR" ] || { echo "no watch simulator"; exit 0; }
          W=$(xcrun simctl create wshots "$WT" "$WR")
          xcrun simctl boot "$W"; xcrun simctl bootstatus "$W" -b || sleep 30
          xcrun simctl install "$W" "$WAPP"
          mkdir -p shots
          # بيانات تجريبية كما يرسلها الآيفون (جدة، ختمة جارية، آية اليوم)
          A=(-lat '<real>21.5433</real>' -lng '<real>39.1728</real>' -city 'جدة' -country 'SA' -w_k_active '<true/>' -w_k_done '<integer>8</integer>' -w_k_target '<integer>20</integer>' -w_k_line 'بقي ١٢ صفحة · من صفحة ٢٨٢' -w_tasbeeh '<integer>27</integer>')
          xcrun simctl launch "$W" com.hawlalaalam.quran.watchkitapp "${A[@]}"; sleep 12
          xcrun simctl io "$W" screenshot shots/watch-1-prayer.png || true
          ls -la shots | grep watch || true

      - name: نشر اللقطات في فرع ci-shots (للمراجعة دون تنزيل)
        if: always()
        working-directory: ios
        run: |
          [ -d shots ] || exit 0
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          rm -rf /tmp/cs && mkdir -p /tmp/cs && cp shots/*.png /tmp/cs/ 2>/dev/null || exit 0
          cd /tmp/cs && git init -q && git checkout -q -b ci-shots && git add . && git commit -qm "shots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots

      - name: حفظ لقطات الشاشة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/shots/

      - name: حفظ سجل البناء (عند الفشل أرسله لنصلحه)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log

  # ١ب) ملف IPA غير موقّع للتجربة على آيفونك قبل تفعيل الحساب (يُوقَّع ويُثبَّت ببرنامج Sideloadly من ويندوز)
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: بيانات المصحف والخطوط من مشروع أندرويد
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/app .

      - name: منصة watchOS (لتطبيق الساعة)
        run: |
          xcodebuild -showsdks | grep -i watch || true
          if ! xcodebuild -showsdks | grep -qi watchos; then xcodebuild -downloadPlatform watchOS; fi
          xcrun simctl list runtimes | grep -i watch || true

      - name: توليد المشروع
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: البناء للآيفون (دون توقيع)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Hawl.xcodeproj -scheme Hawl -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" build 2>&1 | tee ipa.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ipa.log
          mkdir -p out/Payload
          cp -R build/dev/Build/Products/Release-iphoneos/Hawl.app out/Payload/
          cd out && zip -qry ../Hawlalaalam-unsigned.ipa Payload

      - name: حفظ ملف IPA
        uses: actions/upload-artifact@v4
        with:
          name: hawlalaalam-ios-ipa
          path: ios/Hawlalaalam-unsigned.ipa

  # ٢) الرفع إلى TestFlight: يعمل تلقائيًا بعد إضافة أسرار حساب Apple (انظر ios/README.md)
  testflight:
    # الرفع إلى TestFlight بطلب صريح فقط: Run workflow ← رفع = نعم
    if: inputs.upload == true
    runs-on: macos-26
    env:
      HAWL_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: التحقق من أسرار Apple
        id: check
        run: |
          if [ -n "$HAWL_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::لم تُضف أسرار حساب Apple بعد؛ تخطّي الرفع إلى TestFlight"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: بيانات المصحف والخطوط من مشروع أندرويد
        if: steps.check.outputs.ready == 'true'
        run: |
          Z=$(ls *.zip | grep -vi keys | head -1)
          unzip -o -q "$Z" -d /tmp/p
          R=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")
          cp -r "$R"/app .

      - name: تجهيز مفتاح App Store Connect
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: تنظيف شهادات التطوير المؤقتة (كل بناء على GitHub يصنع واحدة ولا يحتفظ بمفتاحها)
        if: steps.check.outputs.ready == 'true'
        run: |
          pip3 install -q --break-system-packages pyjwt cryptography requests 2>/dev/null || pip3 install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          t = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                         os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + t}
          B = "https://api.appstoreconnect.apple.com/v1"
          cs = requests.get(B + "/certificates?filter[certificateType]=DEVELOPMENT&limit=50", headers=H).json().get("data", [])
          for c in cs:
              if "Created via API" in (c["attributes"].get("name") or ""):
                  r = requests.delete(f"{B}/certificates/{c['id']}", headers=H)
                  print("revoked", c["id"], r.status_code)
          PY

      - name: منصة watchOS (لتطبيق الساعة)
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild -showsdks | grep -i watch || true
          if ! xcodebuild -showsdks | grep -qi watchos; then xcodebuild -downloadPlatform watchOS; fi
          xcrun simctl list runtimes | grep -i watch || true

      - name: توليد المشروع
        if: steps.check.outputs.ready == 'true'
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: الأرشفة والتوقيع
        if: steps.check.outputs.ready == 'true'
        working-directory: ios
        run: |
          xcodebuild -version | head -1 | sed 's/^/::notice title=xcode::/'
          set -o pipefail
          xcodebuild -project Hawl.xcodeproj -scheme Hawl -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Hawl.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$HAWL_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            # الأخطاء تظهر في صفحة التشغيل نفسها (Annotations) لتسهيل معرفة السبب
            grep -E "error:|error -|Error Domain|No profiles|No signing|requires a provisioning|Provisioning profile" archive.log | sort -u | head -15 | while IFS= read -r l; do echo "::error title=archive::$l"; done
            tail -25 archive.log | while IFS= read -r l; do echo "::notice title=archive-tail::$l"; done
            exit 1
          fi

      - name: الرفع إلى App Store Connect (TestFlight)
        if: steps.check.outputs.ready == 'true'
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$HAWL_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Hawl.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log || true
          if ! grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log; then
            grep -iE "error|failed" export.log | sort -u | head -15 | while IFS= read -r l; do echo "::error title=export::$l"; done
            tail -20 export.log | while IFS= read -r l; do echo "::notice title=export-tail::$l"; done
            exit 1
          fi

      - name: حفظ سجلات الرفع
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs
          path: ios/*.log
