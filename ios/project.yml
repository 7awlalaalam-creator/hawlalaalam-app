# مشروع iOS لتطبيق «حول العالم | القرآن الكريم»
# يُولَّد ملف Xcode منه تلقائيًا على GitHub (XcodeGen) — لا تحتاج جهاز ماك.
# بيانات المصحف والخطوط وجسر الصفحات (bridge.js) مأخوذة مباشرة من مشروع أندرويد (نسخة واحدة للنظامين).
name: Hawl
options:
  bundleIdPrefix: com.hawlalaalam
  deploymentTarget:
    iOS: "16.1"
  developmentLanguage: ar
  createIntermediateGroups: true
# الإشعارات الفورية (نفس مشروع Firebase المستخدم في أندرويد)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hawl:
    type: application
    platform: iOS
    sources:
      - path: Hawl/Sources
      - path: Hawl/Shared
      - path: Hawl/Assets.xcassets
      - path: ../app/src/main/assets/quran
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/bridge.js
        buildPhase: resources
      - path: ../app/src/main/res/font/tajawal_regular.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/tajawal_medium.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/tajawal_bold.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/hafs.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/amiri_quran.ttf
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/app_logo_png.png
        buildPhase: resources
    dependencies:
      - target: HawlWidgets
        embed: true
        codeSign: true
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: Hawl/Hawl.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hawlalaalam.quran
        aps-environment: development
    info:
      path: Hawl/Info.plist
      properties:
        CFBundleDisplayName: "حول العالم"
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - tajawal_regular.ttf
          - tajawal_medium.ttf
          - tajawal_bold.ttf
          - hafs.ttf
          - amiri_quran.ttf
        # التلاوة مع قفل الشاشة، والتحديث الدوري (آية اليوم، أخبار التطبيق، إعادة جدولة الأذان)
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        # نربط رمز الإشعارات بأنفسنا في AppDelegate بدل التبديل التلقائي من Firebase
        FirebaseAppDelegateProxyEnabled: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.hawlalaalam.quran.refresh
        # روابط التطبيق الداخلية: الويدجت والإشعارات والاختصارات وصفحات الموقع (hawlapp://settings…)
        CFBundleURLTypes:
          - CFBundleURLName: com.hawlalaalam.quran
            CFBundleURLSchemes:
              - hawlapp
        # اختصارات أيقونة التطبيق (الضغط المطوّل) — نفس shortcuts.xml في أندرويد
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: "hawlapp://mood"
            UIApplicationShortcutItemTitle: "آية لحالك"
            UIApplicationShortcutItemSubtitle: "آية تواسيك حسب شعورك"
            UIApplicationShortcutItemIconSymbolName: heart
          - UIApplicationShortcutItemType: "hawlapp://mushaf"
            UIApplicationShortcutItemTitle: "المصحف"
            UIApplicationShortcutItemSubtitle: "افتح المصحف"
            UIApplicationShortcutItemIconSymbolName: book
          - UIApplicationShortcutItemType: "hawlapp://listen"
            UIApplicationShortcutItemTitle: "الاستماع"
            UIApplicationShortcutItemSubtitle: "استمع للقرآن"
            UIApplicationShortcutItemIconSymbolName: headphones
          - UIApplicationShortcutItemType: "hawlapp://qibla"
            UIApplicationShortcutItemTitle: "القبلة"
            UIApplicationShortcutItemSubtitle: "بوصلة اتجاه القبلة"
            UIApplicationShortcutItemIconSymbolName: location.north.circle
        NSLocationWhenInUseUsageDescription: "نستخدم موقعك لحساب مواقيت الصلاة واتجاه القبلة في مدينتك، ولا يُرسل إلى أي جهة."
        NSPhotoLibraryAddUsageDescription: "لحفظ بطاقات الآيات التي تختار حفظها في الصور."
        ITSAppUsesNonExemptEncryption: false
        # الصلاة القادمة في الجزيرة الديناميكية وشاشة القفل (نشاط حيّ)
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes:
          - whatsapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawlalaalam.quran
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO

  # الويدجت: آية اليوم، مواقيت الصلاة، ختمتي، رمضان
  HawlWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HawlWidgets/Sources
      - path: Hawl/Shared
      - path: ../app/src/main/assets/quran/hafs.txt
        buildPhase: resources
      - path: ../app/src/main/res/font/tajawal_regular.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/tajawal_medium.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/tajawal_bold.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/hafs.ttf
        buildPhase: resources
    entitlements:
      path: HawlWidgets/HawlWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hawlalaalam.quran
    info:
      path: HawlWidgets/Info.plist
      properties:
        CFBundleDisplayName: "حول العالم"
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - tajawal_regular.ttf
          - tajawal_medium.ttf
          - tajawal_bold.ttf
          - hafs.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hawlalaalam.quran.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  Hawl:
    build:
      targets:
        Hawl: all
        HawlWidgets: all
    archive:
      config: Release
